<div class="page">
  @if (!rightsLoaded()) {
    <p class="hint">Checking permissions...</p>
  } @else if (!rights().access) {
    <div class="access-denied">You do not have permission to view this form.</div>
  } @else {
  <header>
    <div>
      <div class="kicker">Accounts · Master</div>
      <h2>{{ isNew ? 'New Account Head' : 'Edit Account Head' }}</h2>
    </div>
    <div class="actions">
      <button type="button" (click)="cancel()">Back</button>
      <button type="button" class="primary" [disabled]="saving()" (click)="save()">{{ saving() ? 'Saving...' : 'Save' }}</button>
    </div>
  </header>

  @if (loading()) { <p class="hint">Loading...</p> }
  @if (errorMessage()) { <p class="error">{{ errorMessage() }}</p> }

  <form [formGroup]="form" class="form-body">
    <div class="card">
      <div class="card-body">
        <label>Account Head Name</label>
        <input formControlName="headName" placeholder="e.g. HSBC Bank AED" />

        <label>Under Group</label>
        <select formControlName="groupCode">
          <option [ngValue]="null">-Select-</option>
          @for (g of groups(); track read(g, 'Code')) {
            <option [ngValue]="toNumber(read(g, 'Code'))">
              {{ read(g, 'ParentGroupName') ? (read(g, 'ParentGroupName') + ' > ' + read(g, 'GroupName')) : read(g, 'GroupName') }}
            </option>
          }
        </select>

        <div class="field-grid">
          <div>
            <label>Opening Balance</label>
            <input type="number" formControlName="openingBalance" />
          </div>
          <div>
            <label>Balance Type</label>
            <select formControlName="openingBalanceType">
              <option value="Dr">Debit (Dr)</option>
              <option value="Cr">Credit (Cr)</option>
            </select>
          </div>
        </div>

        <label>Remarks</label>
        <textarea formControlName="remarks" rows="3"></textarea>

        <label class="checkbox-row">
          <input type="checkbox" formControlName="isActive" />
          <span>Active</span>
        </label>
      </div>
    </div>
  </form>
  }
</div>
